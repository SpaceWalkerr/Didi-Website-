# Fly.io deployment for the consultation site.
#
# One machine serves both the API and the built client from a single origin, so
# there is no CORS configuration and no separate static host.
#
# The booking store is a JSON file, so it MUST sit on the mounted volume below —
# a container's own filesystem is discarded on every deploy.

app = "dr-richa-rani"
primary_region = "bom"           # Mumbai — closest to patients in India

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  CLIENT_ORIGIN = "https://dr-richa-rani.fly.dev"

[[mounts]]
  source = "clinic_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true             # patient health data must never travel in the clear
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1       # keep one warm: a cold start during booking looks broken

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
