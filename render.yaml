# Render deployment — the whole app as one service.
#
# One Node process serves the API and the built client from a single origin, so
# there is no CORS to configure and no separate static host.
#
# Bookings live in Postgres, not on disk, which is what makes the free instance
# type viable: free services have no persistent disk, and anything written to
# the container filesystem is erased on every deploy and every idle restart.

services:
  - type: web
    name: dr-richa-rani
    runtime: node
    region: singapore          # closest Render region to India
    plan: free                 # upgrade to 'starter' to stop the service sleeping
    # --include=dev is required: NODE_ENV=production (set below, and needed at
    # runtime) otherwise makes npm skip devDependencies, and vite — which builds
    # the client — is one of them. Without this the build fails with
    # "sh: 1: vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # Postgres connection string — set in the dashboard
      - key: CLIENT_ORIGIN
        sync: false             # this service's own URL, once Render assigns it
      - key: ADMIN_TOKEN
        sync: false             # never commit this — it guards patient health data
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false             # required once the Razorpay keys are live
      - key: WHATSAPP_PROVIDER
        sync: false             # optional: cloud-api for automatic WhatsApp messages
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false             # optional: defaults to the clinic email
      - key: ADMIN_PASSWORD
        sync: false             # optional: defaults to ADMIN_TOKEN
      - key: UPI_ID
        sync: false             # doctor's UPI ID for manual payments (no Razorpay needed)
      - key: SMTP_URL
        sync: false             # confirmation emails; see server/.env.example
